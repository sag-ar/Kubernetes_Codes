apiVersion: v1
kind: Service
metadata:
    name: svc-demo-app
spec:
    type: ClusterIP
    selector:
        app: nginx
        env: prod    
    ports:
        - port: 80  #can be anything
          targetPort: 80 #application port
          protocol: TCP

