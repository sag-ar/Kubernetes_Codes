
apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx-rc
  labels:
    environment: production
spec:
  replicas: 3
  selector:
    env: prod
  template:
    metadata:
      name: nginx-pod
      labels:
        env: prod
        app: nginx
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: DB_USER
              value: "admin"
          resources:
            limits:
              cpu: "50m"
              memory: "300Mi"
            requests:
              cpu: "30m"
              memory: "100Mi"
          volumeMounts:
            - name: shared-data
              mountPath: /usr/share/www/html
      volumes:
        - name: shared-data
          emptyDir: {}

