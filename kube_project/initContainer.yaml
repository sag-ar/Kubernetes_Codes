
apiVersion: v1
kind: Pod
metadata:
  name: shared-volume-pod
  labels:
    env: prod

spec:
  initContainers:
    - name: alpine-container
      image: alpine:latest
      command: ["/bin/sh", "-c"]
      args:
        - "wget -O /var/www/html/index.html 'https://raw.githubusercontent.com/sag-ar/Kubernetes_Codes/main/index.html'"
      volumeMounts:
        - name: shared-data
          mountPath: /var/www/html

  containers:
    - name: nginx-container
      image: nginx:latest
      ports:
        - containerPort: 80
          protocol: TCP
          hostPort: 8080
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html

  volumes:
    - name: shared-data
      emptyDir: {}
