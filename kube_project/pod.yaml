apiVersion: v1
kind: Pod
metadata: 
  name: pod-nginx
  labels:
    app: nginx
    env: prod
spec:
  containers:
    - name: nginx-container
      image: nginx:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: nginx-volume
          mountPath: /usr/share/nginx/html  
  volumes:
    - name: nginx-volume
      emptyDir: {}          